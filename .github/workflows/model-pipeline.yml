name: Document Intelligence Model Pipeline

# Branch-prefix-per-environment GitOps flow. Any branch whose name STARTS
# WITH "dev/", "test/", or "prod/" maps to that environment - e.g. dev/main,
# dev/feature-x, test/main, prod/main all work; only the prefix matters.
#
#   dev/*   -> training is always a deliberate, manual action (see
#              workflow_dispatch below) - run train.py + evaluate.py
#              against Dev for one doc type at a time.
#   test/*  -> after a PR into a test/* branch is merged, promote_pending_models.py
#              copies every model that's newer in the source dev/* branch's
#              state files than in this branch's, then evaluate.py against Test
#   prod/*  -> after a PR into a prod/* branch is merged, same promotion
#              from the source test/* branch's state files into prod, then
#              evaluate.py against Prod
#
# Nothing is trained on test/*/prod/* branches - they only ever promote
# (copy_model.py) a model that was already trained and evaluated on a
# dev/* branch. A PR merge is the human decision point: opening/approving/
# merging "dev/main -> test/main" or "test/main -> prod/main" IS the
# promotion approval, informed by the evaluation report(s) attached to the
# previous run.
#
# Training has no auto-trigger and no trigger file to maintain - a person
# runs this workflow by hand (workflow_dispatch, doc_type input) whenever
# they've finished a round of labeling in Studio and are ready to train.
# The labeled documents themselves never touch Git; they live only in the
# Dev container's training/ prefix (see train.py).
#
# Each doc type has its own state file (config/models/<doc-type>.json) and
# its own reports folder (reports/<doc-type>/), so this repo never has one
# huge shared file/folder that grows without bound as doc types are added.
#
# Authentication: no resource keys anywhere. Each job logs in via OIDC to a
# federated service principal (azure/login below), which DefaultAzureCredential
# in src/common.py then picks up automatically. That SPN must be granted
# "Cognitive Services User" on the Dev/Test/Prod Document Intelligence
# resources, and the Dev DI resource's own managed identity must separately
# be granted "Storage Blob Data Reader" on the training storage account (see
# src/train.py header).
#
# Repository secrets used:
#   DEV_DI_ENDPOINT
#   TEST_DI_ENDPOINT
#   PROD_DI_ENDPOINT
#   DEV_TRAINING_STORAGE_ACCOUNT   # each doc type resolves to its own container: <account>/<doc-type>
#   AZURE_CLIENT_ID / AZURE_TENANT_ID / AZURE_SUBSCRIPTION_ID   # federated SPN for OIDC login
#
# The "test" and "prod" GitHub Environments below can define required
# reviewers/branch protections, so a merge into a test/* or prod/* branch
# still waits for a human approval before it actually promotes anything.

on:
  pull_request:
    branches: ["test/**", "prod/**"]
    types: [closed]
  workflow_dispatch:
    inputs:
      doc_type:
        description: "Doc type to train (required)"
        required: true
      model_kind:
        description: "template | neural"
        required: false
        default: neural
      version_bump:
        description: "major | minor | patch"
        required: false
        default: minor
      dev_branch:
        description: "Which dev/* branch to train and commit to"
        required: false
        default: dev/main

permissions:
  id-token: write
  contents: read

env:
  DEV_DI_ENDPOINT: ${{ secrets.DEV_DI_ENDPOINT }}
  TEST_DI_ENDPOINT: ${{ secrets.TEST_DI_ENDPOINT }}
  PROD_DI_ENDPOINT: ${{ secrets.PROD_DI_ENDPOINT }}
  DEV_TRAINING_STORAGE_ACCOUNT: ${{ secrets.DEV_TRAINING_STORAGE_ACCOUNT }}

jobs:
  schema-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r requirements.txt
      - run: python tests/test_schema.py

  # --- train (workflow_dispatch, always run by hand on a dev/* branch) ---
  train:
    if: github.event_name == 'workflow_dispatch'
    needs: schema-check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.dev_branch }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r requirements.txt
      - name: Azure Login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      - run: |
          python src/train.py --doc-type "${{ github.event.inputs.doc_type }}" \
            --model-kind "${{ github.event.inputs.model_kind }}" \
            --version-bump "${{ github.event.inputs.version_bump }}"
          MODEL_ID=$(python -c "import json; s=json.load(open('config/models/${{ github.event.inputs.doc_type }}.json')); print(s['environments']['dev']['modelId'])")
          python src/evaluate.py --doc-type "${{ github.event.inputs.doc_type }}" --env dev --model-id "$MODEL_ID"
      - run: python tests/test_evaluation_reports.py
      - name: Commit updated state file back to the dev branch
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git add config/models/
          git diff --cached --quiet || git commit -m "Update model state after training [skip ci]"
          git push origin HEAD:${{ github.event.inputs.dev_branch }}
      - uses: actions/upload-artifact@v4
        with:
          name: model-state-and-reports-dev
          path: |
            config/models/
            reports/

  # --- test/* branches: promote whatever's newer in the source dev/* branch
  promote-to-test:
    if: >
      github.event_name == 'pull_request' && github.event.pull_request.merged == true &&
      startsWith(github.base_ref, 'test/') && startsWith(github.head_ref, 'dev/')
    needs: schema-check
    runs-on: ubuntu-latest
    environment: test # add required reviewers here so promotion still needs a human
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.base_ref }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r requirements.txt
      - name: Azure Login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      - name: Get the source dev/* branch's state files for comparison
        run: |
          mkdir -p /tmp/upstream-models
          git archive origin/${{ github.head_ref }} -- config/models | tar -x -C /tmp/upstream-models
      - run: |
          python src/promote_pending_models.py \
            --upstream-models-dir /tmp/upstream-models/config/models \
            --upstream-env dev --this-env test
      - run: python tests/test_evaluation_reports.py
      - name: Commit updated state file(s) back to this branch
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git add config/models/
          git diff --cached --quiet || git commit -m "Promote model(s) dev -> test [skip ci]"
          git push origin HEAD:${{ github.base_ref }}
      - uses: actions/upload-artifact@v4
        with:
          name: model-state-and-reports-test
          path: |
            config/models/
            reports/

  # --- prod/* branches: promote whatever's newer in the source test/* branch
  promote-to-prod:
    if: >
      github.event_name == 'pull_request' && github.event.pull_request.merged == true &&
      startsWith(github.base_ref, 'prod/') && startsWith(github.head_ref, 'test/')
    needs: schema-check
    runs-on: ubuntu-latest
    environment: prod # configure required reviewers on this GitHub Environment for manual approval
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.base_ref }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r requirements.txt
      - name: Azure Login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      - name: Get the source test/* branch's state files for comparison
        run: |
          mkdir -p /tmp/upstream-models
          git archive origin/${{ github.head_ref }} -- config/models | tar -x -C /tmp/upstream-models
      - run: |
          python src/promote_pending_models.py \
            --upstream-models-dir /tmp/upstream-models/config/models \
            --upstream-env test --this-env prod
      - run: python tests/test_evaluation_reports.py
      - name: Commit updated state file(s) back to this branch
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git add config/models/
          git diff --cached --quiet || git commit -m "Promote model(s) test -> prod [skip ci]"
          git push origin HEAD:${{ github.base_ref }}
      - uses: actions/upload-artifact@v4
        with:
          name: model-state-and-reports-prod
          path: |
            config/models/
            reports/
